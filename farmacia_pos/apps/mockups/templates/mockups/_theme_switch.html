<div class="theme-switch" role="group" aria-label="Apariencia">

  <button type="button" data-set-theme="dim" aria-label="Tema intermedio" title="Intermedio"><i class="bi bi-circle-half"></i></button>
  <button type="button" data-set-theme="light" aria-label="Tema claro" title="Claro"><i class="bi bi-sun"></i></button>
</div>
