# Desarrollo local: PostgreSQL 18. Compatible con `podman compose` y `docker compose`.
services:
  db:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_DB: farmacia_dev
      POSTGRES_USER: farmacia_app
      POSTGRES_PASSWORD: local-only-password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmacia_app -d farmacia_dev"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
