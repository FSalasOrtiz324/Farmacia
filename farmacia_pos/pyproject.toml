[project]
name = "farmacia-pos"
version = "0.1.0"
description = "Sistema POS y administración para farmacia en Chile (en desarrollo; no certificado)"
requires-python = "==3.14.*"
dependencies = [
    "django==6.1.2",
    "psycopg[binary]>=3.2,<4",
    "dj-database-url>=3.0,<4",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
"**/tests.py" = ["S105", "S106"]
"tests/**" = ["S105", "S106"]
